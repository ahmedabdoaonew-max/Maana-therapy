<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="بوستر معنى ثيرابي">
<style>
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
.glow{transform-box:fill-box;transform-origin:center;animation:gl 1.3s ease-in-out infinite}
.fh{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 3.6s ease-out infinite}
.h2{animation-delay:1.3s}.h3{animation-delay:2.5s}
.tx{animation:tg 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:translateY(-7px) scale(1.26) rotate(-5deg)}26%{transform:scale(.97)}40%{transform:translateY(-4px) scale(1.16) rotate(4deg)}54%{transform:scale(1)}}
@keyframes gl{0%,100%{opacity:.2}14%{opacity:.95}28%{opacity:.25}42%{opacity:.7}}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx,12px),-95px) scale(1.5)}}
@keyframes tg{0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,.35))}50%{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px rgba(255,236,240,.9))}}
</style>
<defs><radialGradient id="bg" cx=".32" cy=".25" r="1"><stop offset="0" stop-color="#cfaeb1"/><stop offset=".55" stop-color="#BA969A"/><stop offset="1" stop-color="#8A6674"/></radialGradient></defs>
<rect width="1080" height="1080" fill="#f6ecd7"/>
<circle cx="540" cy="540" r="520" fill="url(#bg)"/>
<circle cx="540" cy="540" r="490" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
<g transform="translate(375 130) scale(1.1)"><defs>
    <linearGradient id="balHg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d3d4"/><stop offset="1" stop-color="#e59aa5"/></linearGradient>
    <linearGradient id="balGg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c88a"/><stop offset="1" stop-color="#b88f45"/></linearGradient>
    <linearGradient id="balOg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56653f"/><stop offset="1" stop-color="#333A26"/></linearGradient>
    <radialGradient id="balGl"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset="1" stop-color="#eaaaa5" stop-opacity="0"/></radialGradient>
  </defs>
  <path class="ring"  d="M234.9 65.1 A120 120 0 1 0 262.8 191" fill="none" stroke="url(#balGg)" stroke-width="3" stroke-linecap="round"/>
  <circle class="glow" cx="170" cy="182" r="84" fill="url(#balGl)"/>
  <g class="hug">
    <circle class="head" cx="112" cy="70" r="19" fill="url(#balOg)"/>
    <path class="arm"  d="M112 108 C74 128 62 184 88 224 C112 252 170 254 214 230" fill="none" stroke="url(#balOg)" stroke-width="34" stroke-linecap="round"/>
  </g>
  <g class="heart-wrap"><g transform="translate(172 178) scale(1.28)"><g class="heart">
    <path d="M0 38C-52 6-50-36-24-38C-10-39 0-31 0-22C0-31 10-39 24-38C50-36 52 6 0 38Z" fill="url(#balHg)"/>
    <ellipse cx="-22" cy="-22" rx="11" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 -22 -22)"/>
  </g></g></g>
  <g transform="translate(150 150)"><g class="fh h1" style="--dx:-14px;--rot:-16deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g><g transform="translate(196 146)"><g class="fh h2" style="--dx:16px;--rot:18deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g><g transform="translate(172 140)"><g class="fh h3" style="--dx:2px;--rot:10deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g>
  <g stroke="url(#balGg)" stroke-width="3" stroke-linecap="round">
    <line class="spark s1" x1="228" y1="120" x2="238" y2="102"/>
    <line class="spark s2" x1="240" y1="138" x2="258" y2="130"/>
    <line class="spark s3" x1="242" y1="158" x2="262" y2="158"/>
  </g>
</g>
<text x="540" y="565" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="800" font-size="60">رحلتك نحو التوازن تبدأ من هنا</text>
<text x="540" y="640" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="500" font-size="34" fill-opacity=".95">نقدم لك برامج علاجية متكاملة صُممت</text>
<text x="540" y="690" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="500" font-size="34" fill-opacity=".95">لتناسب احتياجاتك النفسية، وتساعدك</text>
<text x="540" y="740" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="500" font-size="34" fill-opacity=".95">على فهم ذاتك، وتجاوز التحديات،</text>
<text x="540" y="790" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="500" font-size="34" fill-opacity=".95">والوصول إلى حياة أكثر توازنًا ووعيًا.</text>
<g class="tx"><text x="540" y="888" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="800" font-size="40">اكتشف العلاج الأنسب ليك،</text><text x="540" y="938" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="800" font-size="40">وابدأ خطوتك نحو التغيير</text></g>
</svg>