<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="بانر معنى ثيرابي — رحلتك نحو التوازن تبدأ من هنا">
<style>
.heart{transform-box:fill-box;transform-origin:center;animation:beat 1.3s ease-in-out infinite}
.glow{transform-box:fill-box;transform-origin:center;opacity:.2;animation:gl 1.3s ease-in-out infinite}
.fh{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 3.6s ease-out infinite}
.h1{animation-delay:.4s}.h2{animation-delay:1.7s}.h3{animation-delay:2.9s}
.tx{animation:tg 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translateY(0) scale(1) rotate(0)}12%{transform:translateY(-7px) scale(1.26) rotate(-5deg)}26%{transform:scale(.97)}40%{transform:translateY(-4px) scale(1.16) rotate(4deg)}54%{transform:scale(1)}}
@keyframes gl{0%,100%{opacity:.2;transform:scale(.9)}14%{opacity:.95;transform:scale(1.25)}28%{opacity:.25}42%{opacity:.7;transform:scale(1.12)}}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.4)}15%{opacity:.95}100%{opacity:0;transform:translate(var(--dx,12px),-95px) scale(1.5)}}
@keyframes tg{0%,100%{filter:drop-shadow(0 0 3px rgba(255,255,255,.35))}50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 20px rgba(255,236,240,.9))}}
</style>
<defs>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf6f5"/><stop offset="1" stop-color="#f1e6e6"/></linearGradient>
<radialGradient id="orb" cx=".32" cy=".25" r="1"><stop offset="0" stop-color="#cfaeb1"/><stop offset=".55" stop-color="#BA969A"/><stop offset="1" stop-color="#8A6674"/></radialGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6A4A59" flood-opacity=".3"/></filter>
<clipPath id="cp"><rect width="1080" height="1080" rx="96"/></clipPath>
</defs>
<rect width="1080" height="1080" rx="96" fill="url(#card)"/>
<g clip-path="url(#cp)"><rect x="560" y="90" width="620" height="520" rx="150" fill="#BA969A" opacity=".13" transform="rotate(-8 870 350)"/></g>
<rect x="1.5" y="1.5" width="1077" height="1077" rx="95" fill="none" stroke="#BA969A" stroke-opacity=".3" stroke-width="3"/>
<text x="540" y="160" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" font-size="70" font-weight="800" fill="#6A4A59">رحلتك نحو التوازن تبدأ من هنا</text>
<text x="540" y="255" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" font-size="34" font-weight="500" fill="#7a5666">نقدم لك برامج علاجية متكاملة صُممت لتناسب</text><text x="540" y="301" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" font-size="34" font-weight="500" fill="#7a5666">احتياجاتك النفسية، وتساعدك على فهم ذاتك،</text><text x="540" y="347" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" font-size="34" font-weight="500" fill="#7a5666">وتجاوز التحديات، والوصول إلى حياة</text><text x="540" y="393" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" font-size="34" font-weight="500" fill="#7a5666">أكثر توازنًا ووعيًا.</text>
<circle cx="540" cy="742" r="268" fill="url(#orb)" stroke="#fff" stroke-width="28" filter="url(#sh)"/>
<g transform="translate(425 528) scale(.76)"><defs>
    <linearGradient id="balHg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d3d4"/><stop offset="1" stop-color="#e59aa5"/></linearGradient>
    <linearGradient id="balGg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6c88a"/><stop offset="1" stop-color="#b88f45"/></linearGradient>
    <linearGradient id="balOg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#56653f"/><stop offset="1" stop-color="#333A26"/></linearGradient>
    <radialGradient id="balGl"><stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset="1" stop-color="#eaaaa5" stop-opacity="0"/></radialGradient>
  </defs>
  <path class="ring"  d="M234.9 65.1 A120 120 0 1 0 262.8 191" fill="none" stroke="url(#balGg)" stroke-width="3" stroke-linecap="round"/>
  <circle class="glow" cx="170" cy="182" r="84" fill="url(#balGl)"/>
  <g class="hug">
    <circle class="head" cx="112" cy="70" r="19" fill="url(#balOg)"/>
    <path class="arm"  d="M112 108 C74 128 62 184 88 224 C112 252 170 254 214 230" fill="none" stroke="url(#balOg)" stroke-width="34" stroke-linecap="round"/>
  </g>
  <g class="heart-wrap"><g transform="translate(172 178) scale(1.28)"><g class="heart">
    <path d="M0 38C-52 6-50-36-24-38C-10-39 0-31 0-22C0-31 10-39 24-38C50-36 52 6 0 38Z" fill="url(#balHg)"/>
    <ellipse cx="-22" cy="-22" rx="11" ry="6" fill="#fff" opacity=".35" transform="rotate(-30 -22 -22)"/>
  </g></g></g>
  <g transform="translate(150 150)"><g class="fh h1" style="--dx:-14px;--rot:-16deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g><g transform="translate(196 146)"><g class="fh h2" style="--dx:16px;--rot:18deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g><g transform="translate(172 140)"><g class="fh h3" style="--dx:2px;--rot:10deg"><path d="M0 6C-12-2-11-11-5-11C-2-11 0-9 0-7C0-9 2-11 5-11C11-11 12-2 0 6Z" fill="#fff"/></g></g>
  <g stroke="url(#balGg)" stroke-width="3" stroke-linecap="round">
    <line class="spark s1" x1="228" y1="120" x2="238" y2="102"/>
    <line class="spark s2" x1="240" y1="138" x2="258" y2="130"/>
    <line class="spark s3" x1="242" y1="158" x2="262" y2="158"/>
  </g>
</g>
<g class="tx" font-family="'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,Arial,sans-serif" text-anchor="middle" fill="#fff" font-weight="800" font-size="40"><text x="540" y="822">اكتشف العلاج الأنسب ليك،</text><text x="540" y="868">وابدأ خطوتك نحو التغيير</text></g>
</svg>